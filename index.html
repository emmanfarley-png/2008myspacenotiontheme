<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>emma online</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="homepage">

    <section class="top-section">

      <div class="profile-card">

        <div class="profile-header">

          <img
            class="profile-photo"
            src="https://placehold.co/200x200"
            alt="Emma profile photo"
          >

          <div class="profile-identity">

            <h1>emma</h1>

            <p class="online-status">
              <span class="online-ring">
                <span class="online-dot"></span>
              </span>

              ONLINE NOW
            </p>

          </div>

        </div>

        <div class="profile-details">

          <p class="status">
            "probably doing something completely unnecessary on the internet"
          </p>

          <p class="bio">
            26 · los angeles<br>
            professional internet user
          </p>

        </div>

      </div>


      <div class="music-card">

  <h2 class="music-heading">♫ NOW PLAYING</h2>

  <div class="playlist-switcher">
    <button class="playlist-tab active">teen chick flick</button>
    <button class="playlist-tab">radio disney</button>
  </div>

  <div class="nano">
    <div class="nano-screen">
      <div class="nano-status-bar">
        <span>emma’s nano</span>
        <span>♡</span>
      </div>

      <img
        class="nano-album-art"
        src="https://placehold.co/300x300/f7a8d3/111111?text=album+art"
        alt="Album art"
      >

      <div class="nano-song-info">
        <p class="nano-label">currently playing</p>
        <h3 class="nano-song-title">Bring It On: All or Nothing</h3>
        <p class="nano-artist">teen chick flick soundtrack core</p>
      </div>
    </div>

    <div class="click-wheel">
      <span class="wheel-label wheel-menu">MENU</span>
      <span class="wheel-label wheel-left">⏮</span>
      <span class="wheel-label wheel-right">⏭</span>
      <span class="wheel-label wheel-bottom">▶︎❚❚</span>
      <div class="wheel-center"></div>
    </div>
  </div>

</div>
      </div>

    </section>

  </main>

</body>
</html>
