<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>emma online</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="homepage">

    <section class="top-section">

      <div class="profile-card">

        <div class="profile-header">

          <img
            class="profile-photo"
            src="https://placehold.co/200x200"
            alt="Emma profile photo"
          >

          <div class="profile-identity">

            <h1>emma</h1>

            <p class="online-status">
              <span class="online-ring">
                <span class="online-dot"></span>
              </span>

              ONLINE NOW
            </p>

          </div>

        </div>

        <div class="profile-details">

          <p class="status">
            "probably doing something completely unnecessary on the internet"
          </p>

          <p class="bio">
            26 · los angeles<br>
            professional internet user
          </p>

        </div>

      </div>


      <div class="ipod-card">

        <p class="ipod-label">
          ♫ NOW PLAYING
        </p>

        <div class="ipod-placeholder">
          pink ipod nano
          <br>
          coming soon ♡
        </div>

      </div>

    </section>

  </main>

</body>
</html>
