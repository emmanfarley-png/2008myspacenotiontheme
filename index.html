<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>emma online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="music-card">
    <h2 class="music-heading">♫ NOW PLAYING</h2>

    <div class="playlist-tabs">
      <button class="playlist-btn active">teen chick flick</button>
      <button class="playlist-btn">radio disney</button>
    </div>

    <div class="ipod-wrap">
      <img
        class="real-ipod"
        src="ipod-nano.png"
        alt="Pink iPod Nano"
      >

      <div class="ipod-screen">
        <div class="screen-top">
          <span class="nano-label">emma’s nano</span>
          <span class="nano-heart">♡</span>
        </div>

        <img
          class="album-art"
          src="https://placehold.co/300x300/f1a6cb/111111?text=album+art"
          alt="Album art"
        >

        <p class="now-playing-label">CURRENTLY PLAYING</p>

        <h3 class="song-title">Bring It On: All or Nothing</h3>

        <p class="song-vibe">teen chick flick soundtrack core</p>
      </div>
    </div>
  </section>

</body>
</html>
