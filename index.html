<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>★ emma is online ★</title>

  <link rel="stylesheet" href="style.css?v=8">
</head>


<body>

  <main class="homepage">

    <section class="top-section">


      <!-- PROFILE CARD -->

      <div class="profile-card">

        <div class="profile-header">

          <img
            class="profile-photo"
            src="https://placehold.co/200x200"
            alt="Emma profile photo"
          >

          <div class="profile-identity">

            <h1>emma</h1>

            <p class="online-status">

              <span class="online-ring">
                <span class="online-dot"></span>
              </span>

              ONLINE NOW

            </p>

          </div>

        </div>


        <div class="profile-details">

          <p class="status">
            "probably doing something completely unnecessary on the internet"
          </p>

          <p class="bio">
            26 · los angeles<br>
            professional internet user
          </p>

        </div>

      </div>


      <!-- MUSIC CARD -->

      <div class="music-card">

        <h2 class="music-heading">
          ♫ NOW PLAYING
        </h2>


        <!-- PLAYLIST SWITCHER -->

        <div class="playlist-tabs">

          <button
            class="playlist-btn active"
            id="teen-playlist"
            type="button"
          >
            teen chick flick
          </button>

          <button
            class="playlist-btn"
            id="disney-playlist"
            type="button"
          >
            radio disney
          </button>

        </div>


        <!-- IPOD -->

        <div class="ipod-wrap">

          <img
            class="real-ipod"
            src="ipod-nano-front.png"
            alt="Pink iPod Nano"
          >


          <!-- CUSTOM SCREEN OVERLAY -->

          <div class="ipod-screen">

            <div class="screen-top">

              <span class="nano-label">
                emma’s nano
              </span>

              <span class="nano-heart">
                ♡
              </span>

            </div>


            <!-- BEFORE SPOTIFY CONNECTS -->

            <div
              class="spotify-login"
              id="spotify-login"
            >

              <button
                class="connect-spotify"
                id="connect-spotify"
                type="button"
              >
                ♡ CONNECT SPOTIFY
              </button>

              <p
                class="spotify-status"
                id="spotify-status"
              >
                not connected
              </p>

            </div>


            <!-- REAL NOW PLAYING SCREEN -->

            <div
              class="nano-player hidden"
              id="nano-player"
            >

              <div class="now-playing-label">
                Now Playing
              </div>

              <img
                id="track-art"
                class="track-art-full"
                alt="Current album art"
              >

              <div class="progress-section">

                <div class="time-row">

                  <span id="current-time">
                    0:00
                  </span>

                  <span id="total-time">
                    0:00
                  </span>

                </div>

                <div class="progress-bar">

                  <div
                    class="progress-fill"
                    id="progress-fill"
                  ></div>

                </div>

              </div>


              <div class="track-meta">

                <p
                  class="track-title-full"
                  id="track-title"
                >
                  Track Title
                </p>

                <p
                  class="track-artist-full"
                  id="track-artist"
                >
                  Artist Name
                </p>

              </div>

            </div>

          </div>
          <!-- END IPOD SCREEN -->


          <!-- INVISIBLE CLICK-WHEEL HOTSPOTS -->

          <button
            class="wheel-hotspot wheel-prev"
            id="wheel-prev"
            type="button"
            aria-label="Previous track"
          ></button>

          <button
            class="wheel-hotspot wheel-next"
            id="wheel-next"
            type="button"
            aria-label="Next track"
          ></button>

          <button
            class="wheel-hotspot wheel-play"
            id="wheel-play"
            type="button"
            aria-label="Play or pause"
          ></button>

          <button
            class="wheel-hotspot wheel-center"
            id="wheel-center"
            type="button"
            aria-label="Play or pause"
          ></button>

        </div>
        <!-- END IPOD -->

      </div>
      <!-- END MUSIC CARD -->


    </section>

  </main>


  <!-- our JavaScript -->

  <script src="script.js?v=8"></script>

</body>

</html>
