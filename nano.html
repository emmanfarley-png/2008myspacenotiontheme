<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>emma's nano</title>

  <link
    rel="stylesheet"
    href="nano-widget.css?v=1"
  >
</head>


<body>

  <div class="music-card">

    <h2 class="music-heading">
      ♫ NOW PLAYING
    </h2>


    <div class="playlist-tabs">

      <button
        class="playlist-btn active"
        id="teen-playlist"
        type="button"
      >
        teen chick flick
      </button>

      <button
        class="playlist-btn"
        id="disney-playlist"
        type="button"
      >
        radio disney
      </button>

    </div>


    <div class="ipod-wrap">

      <img
        class="real-ipod"
        src="ipod-nano-front.png"
        alt="Pink iPod Nano"
      >


      <div class="ipod-screen">

        <div class="screen-top">

          <span class="nano-label">
            emma’s nano
          </span>

          <span class="nano-heart">
            ♡
          </span>

        </div>


        <div
          class="spotify-login"
          id="spotify-login"
        >

          <button
            class="connect-spotify"
            id="connect-spotify"
            type="button"
          >
            ♡ CONNECT SPOTIFY
          </button>

          <p
            class="spotify-status"
            id="spotify-status"
          >
            not connected
          </p>

        </div>


        <div
          class="nano-player hidden"
          id="nano-player"
        >

          <div class="now-playing-label">
            Now Playing
          </div>

          <img
            id="track-art"
            class="track-art-full"
            alt="Current album art"
          >

          <div class="progress-section">

            <div class="time-row">

              <span id="current-time">
                0:00
              </span>

              <span id="total-time">
                0:00
              </span>

            </div>

            <div class="progress-bar">

              <div
                class="progress-fill"
                id="progress-fill"
              ></div>

            </div>

          </div>


          <div class="track-meta">

            <p
              class="track-title-full"
              id="track-title"
            >
              Track Title
            </p>

            <p
              class="track-artist-full"
              id="track-artist"
            >
              Artist Name
            </p>

          </div>

        </div>

      </div>


      <button
        class="wheel-hotspot wheel-prev"
        id="wheel-prev"
        type="button"
        aria-label="Previous track"
      ></button>

      <button
        class="wheel-hotspot wheel-next"
        id="wheel-next"
        type="button"
        aria-label="Next track"
      ></button>

      <button
        class="wheel-hotspot wheel-play"
        id="wheel-play"
        type="button"
        aria-label="Play or pause"
      ></button>

      <button
        class="wheel-hotspot wheel-center"
        id="wheel-center"
        type="button"
        aria-label="Select"
      ></button>

    </div>

  </div>


  <script src="script.js?v=10"></script>

</body>

</html>
